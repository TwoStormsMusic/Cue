; A performance shaped like the Cue Template (five chains, effects, a wah,
; a tuner pedal, a branch to FOH), made of built-in blocks and the bundled
; test plug-ins, so the app can be tried on any machine. Paths are relative
; to this file.
; Run:  cue run configs/app-demo.ini            (or --audio none, without a sound card)
;       cue-app
; Check: cue check configs/app-demo.ini

[audio]
device = hw:M2
period = 64
periods = 3
input = 1
out1 = 1
out2 = 2

[switching]
preroll_ms = 50
crossfade_ms = 20
warm = next

[midi]
in = M2
profile = eurekaprom

[performance App demo]
inputs = Bass
outputs = FOH, Amp

[tuner]
range = bass

[scene Cue Template]

[chain Punk]
plugin = clap:../plugins/Cue Test Plugins.clap#cue.test.gain
name = Gain Stage
plugin = builtin:lowpass 2500
name = Wah
bypass = yes
plugin = builtin:drive 3
name = Darkglass Ultra
plugin = builtin:gain 1
name = Act
tap = Amp
branch = FOH

[branch FOH]
plugin = builtin:lowpass 6000
name = IR Loader
plugin = clap:../plugins/Cue Test Plugins.clap#cue.test.delay
name = Chorus
bypass = yes
tap = FOH

[chain Slap]
plugin = clap:../plugins/Cue Test Plugins.clap#cue.test.gain
name = Gain Stage
plugin = builtin:lowpass 2500
name = Wah
bypass = yes
plugin = builtin:drive 2
name = Darkglass Ultra
plugin = builtin:gain 1
name = Act
tap = Amp
branch = FOH

[branch FOH]
plugin = builtin:lowpass 6000
name = IR Loader
plugin = builtin:drive 1.5
name = Saturator
plugin = clap:../plugins/Cue Test Plugins.clap#cue.test.delay
name = Chorus
bypass = yes
tap = FOH

[chain 2000s]
plugin = clap:../plugins/Cue Test Plugins.clap#cue.test.gain
name = Gain Stage
plugin = builtin:lowpass 2500
name = Wah
bypass = yes
plugin = builtin:drive 5
name = Darkglass Ultra
plugin = builtin:gain 1
name = Act

[chain Motown]
plugin = clap:../plugins/Cue Test Plugins.clap#cue.test.gain
name = Gain Stage
plugin = builtin:lowpass 2500
name = Wah
bypass = yes
plugin = builtin:lowpass 1800
name = Tone
plugin = builtin:gain 1
name = Act

[chain Djent]
plugin = clap:../plugins/Cue Test Plugins.clap#cue.test.gain
name = Gain Stage
plugin = builtin:lowpass 2500
name = Wah
bypass = yes
plugin = builtin:drive 8
name = Darkglass Ultra
plugin = clap:../plugins/Cue Test Plugins.clap#cue.test.delay
name = Delay
bypass = yes
plugin = builtin:gain 1
name = Act

[preset Punk]
pedal = 6
display = PU

[preset Slap]
pedal = 7
display = SL

[preset 2000s]
pedal = 8
display = 2K

[preset Motown]
pedal = 9
display = MO

[preset Djent]
pedal = 10
display = DJ

[control Effect 1]
pedal = 1
default = on
enable = Chorus

[control Effect 2]
pedal = 2
enable = Delay

[control Effect 3]
pedal = 3

[control Wah]
values = Off, Auto, Pedal
pedal = 4
enable = Wah when Auto
enable = Wah when Pedal

[control Tuner]
pedal = 5
mute = on
