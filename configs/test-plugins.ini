; Chains built from the bundled test plug-ins, to check CLAP and VST3
; hosting, MIDI into plug-ins and the pedals on the rig with nothing of yours
; loaded. Paths are relative to this file.
; Check: cue check configs/test-plugins.ini
; Bench: cue bench configs/test-plugins.ini --wav test.wav

[audio]
device = hw:M2
period = 64
input = 1
out1 = 1
out2 = 2

[switching]
preroll_ms = 50
crossfade_ms = 20
warm = next

[midi]
in = M2
profile = eurekaprom

[scene Test]

[chain CLAP gain and burn]
plugin = clap:../plugins/Cue Test Plugins.clap#cue.test.gain
name = Gain
plugin = clap:../plugins/Cue Test Plugins.clap#cue.test.burn
param = 0:0.3

; The test pedal follows CC 11 like a wah pedal follows the expression pedal.
[chain CLAP pedal and delay]
plugin = clap:../plugins/Cue Test Plugins.clap#cue.test.pedal
name = Pedal
plugin = clap:../plugins/Cue Test Plugins.clap#cue.test.burn
param = 0:0.3
tap = out2
plugin = clap:../plugins/Cue Test Plugins.clap#cue.test.delay
name = Delay

[chain VST3 delay]
plugin = builtin:drive 3
tap = out2
plugin = vst3:../plugins/Cue Test.vst3
name = VST3 Delay

[preset Gain]
chain = CLAP gain and burn
pedal = 6

[preset Pedal and delay]
chain = CLAP pedal and delay
pedal = 7

[preset VST3]
chain = VST3 delay
pedal = 8

[control Level]
values = Quiet, Full
pedal = 1
default = Full
drive = Gain param 0 from 0.25 to 1

[control Delay]
pedal = 2
default = on
enable = Delay
enable = VST3 Delay

; The FCB's left expression pedal moves the test pedal's volume.
[control Volume]
type = continuous
range = 0..1
default = 1
follows = expression 1
drive = Pedal param 0
