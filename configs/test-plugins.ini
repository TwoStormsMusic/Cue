; Scenes built from the bundled test plug-ins, to check CLAP and VST3 hosting
; on the rig with nothing of yours loaded. Paths are relative to this file.
; Bench: stagehost bench configs/test-plugins.ini --wav test.wav

[audio]
device = hw:M2
period = 64
input = 1
out1 = 1
out2 = 2

[switching]
preroll_ms = 50
crossfade_ms = 20
warm = next

[midi]
in = FCB
profile = eurekaprom

[scene CLAP gain and burn]
pedal = 1
plugin = clap:../plugins/Stagehost Test Plugins.clap#stagehost.test.gain
plugin = clap:../plugins/Stagehost Test Plugins.clap#stagehost.test.burn
param = 0:0.3

[scene CLAP delay]
pedal = 2
plugin = clap:../plugins/Stagehost Test Plugins.clap#stagehost.test.burn
param = 0:0.3
tap = out2
plugin = clap:../plugins/Stagehost Test Plugins.clap#stagehost.test.delay

[scene VST3 delay]
pedal = 3
plugin = builtin:drive 3
tap = out2
plugin = vst3:../plugins/Stagehost Test.vst3
