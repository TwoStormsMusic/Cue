; The pedals of Adam's REAPER template (ReaLearn), for Cue.
;
; Import the project with this file as its mapping:
;   cue import-rpp "Cue Template.RPP" --mapping configs/cue-template-mapping.ini
; The imported config includes this file after its chains, so the presets
; below belong to the imported scene and pick its chains by name.
;
; FCB1010 (EurekaPROM):
;   1-3      Effect 1-3 on/off (nothing assigned yet: LEDs only, as in REAPER)
;   4        Wah: off, auto, pedal, off ... (as ReaLearn stepped it); the
;            pedal wah follows the right expression pedal. As in REAPER, LED 4
;            and the Value 1 LED light for either wah, Value 2 for the pedal wah
;   5        Tuner: mutes both outputs and shows TU
;   6-10     Punk, Slap, 2000s, Motown, Djent. Each starts with Effect 1 on,
;            Effects 2 and 3 off and no wah
;   up/down  next/previous preset

[preset Punk]
pedal = 6
display = PU
do = group Preset start

[preset Slap]
pedal = 7
display = SL
do = group Preset start

[preset 2000s]
pedal = 8
display = OO          ; ReaLearn showed the letter O twice
do = group Preset start

[preset Motown]
pedal = 9
display = MO
do = group Preset start

[preset Djent]
pedal = 10
display = DJ
do = group Preset start

; What selecting a preset resets: ReaLearn's "Param 1 - Toggle Tracks" group.
[group Preset start]
do = Effect 1 = on
do = Effect 2 = off
do = Effect 3 = off
do = Wah = Off

; Effects 1-3 switch nothing yet. To have pedal 1 switch the chorus in
; every chain, add:  enable = TwoStorms Chorus
[control Effect 1]
pedal = 1

[control Effect 2]
pedal = 2

[control Effect 3]
pedal = 3

; Every chain has two TwoStorms Wahs, both bypassed: the first is set up as
; the auto wah, the second as the pedal wah. The pedal wah listens to CC 103,
; the FCB's right expression pedal, which Cue passes on to plug-ins that take
; MIDI.
[control Wah]
values = Off, Auto, Pedal
pedal = 4
enable = TwoStorms Wah:1 when Auto
enable = TwoStorms Wah:2 when Pedal

[control Tuner]
pedal = 5
mute = on

[fcb]
display = TU when Tuner
led value 1 = Wah is not Off   ; EurekaPROM LED 18, as ReaLearn's "Open/Close Val1"
led value 2 = Wah is Pedal     ; LED 19, as ReaLearn's "Open/Close Val2"
