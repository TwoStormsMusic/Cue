; Three heavy scenes made of built-in blocks, so the switching engine can be
; tried on the mini PC before any real plug-in is involved.
; Run:   stagehost run configs/builtin-demo.ini
; Bench: stagehost bench configs/builtin-demo.ini --wav demo.wav
; Use ';' for comments after a value.

[audio]
device = hw:M2
rate = 48000
period = 64
periods = 2
input = 1          ; M2 input carrying the bass DI
out1 = 1           ; FOH via the IMP 2
out2 = 2           ; power amp and cab
cpu = auto         ; last performance core
priority = 80
mix = sum

[switching]
preroll_ms = 50
crossfade_ms = 20
tail_cap_ms = 10000
warm = next

[midi]
in = FCB           ; any port whose name contains this; 'any' for all
profile = eurekaprom
channel = 1

[scene Clean]
pedal = 1
plugin = builtin:gain 0.8
plugin = builtin:lowpass 6000
tap = out2
plugin = builtin:lowpass 4000

[scene Drive]
pedal = 2
plugin = builtin:burn 400
plugin = builtin:drive 4
tap = out2
plugin = builtin:lowpass 2500

[scene Drive and delay]
pedal = 3
plugin = builtin:burn 400
plugin = builtin:drive 6
tap = out2
plugin = builtin:lowpass 3000
plugin = builtin:delay 380 0.45 0.4
