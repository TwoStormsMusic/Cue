; Three heavy chains made of built-in blocks, so switching and the pedals can
; be tried on the mini PC before any real plug-in is involved.
; Run:   cue run configs/builtin-demo.ini
; Bench: cue bench configs/builtin-demo.ini --wav demo.wav
; Use ';' for comments after a value. docs/config.md explains every line.
;
; FCB1010: pedals 6-8 pick a preset, pedal 1 switches the delay in the
; third chain, pedal 4 steps the drive through Low, Mid and High, pedal 5
; mutes (a stand-in for the tuner).

[audio]
device = hw:M2
rate = 48000
period = 64
periods = 2
input = 1          ; M2 input carrying the bass DI
out1 = 1           ; FOH via the IMP 2
out2 = 2           ; power amp and cab
cpu = auto         ; last performance core
priority = 80
mix = sum

[switching]
preroll_ms = 50
crossfade_ms = 20
tail_cap_ms = 10000
warm = next

[midi]
in = M2            ; any port whose name contains this; 'any' for all
profile = eurekaprom
channel = 1

[performance Demo]

[scene Demo]

[chain Clean]
plugin = builtin:gain 0.8
plugin = builtin:lowpass 6000
tap = out2         ; out 2 takes the signal here
plugin = builtin:lowpass 4000

[chain Drive]
plugin = builtin:burn 400
plugin = builtin:drive 4
name = Drive
tap = out2
plugin = builtin:lowpass 2500

; The delay only reaches out 1 (FOH): it sits on a branch.
[chain Drive and delay]
plugin = builtin:burn 400
plugin = builtin:drive 6
plugin = builtin:lowpass 3000
branch = FOH
tap = out2

[branch FOH]
plugin = builtin:delay 380 0.45 0.4
name = Delay
tap = out1

[preset Clean]
pedal = 6
display = CL

[preset Drive]
pedal = 7
display = DR
do = Drive amount = Mid

[preset Delay]
chain = Drive and delay
pedal = 8
display = DL
do = Delay on = on

[control Delay on]
pedal = 1
default = on
enable = Delay

[control Drive amount]
values = Low, Mid, High
pedal = 4
; builtin blocks take no parameters; with a real plug-in this would be
; drive = <plug-in> param <id> from <low> to <high>

[control Mute]
pedal = 5
mute = on

[fcb]
display = MU when Mute
