; A template for your own chains, written by hand. The quickest way to a
; config of your REAPER chains is to import the project instead:
;   cue import-rpp "Cue Template.RPP" --mapping configs/cue-template-mapping.ini
; cue scan <file> shows what is inside a plug-in file, cue params <file>
; lists its parameter ids. docs/config.md explains every line.

[audio]
device = hw:M2
rate = 48000
period = 64
periods = 2
input = 1
out1 = 1           ; FOH via the IMP 2
out2 = 2           ; power amp and cab
cpu = auto
priority = 80

[switching]
preroll_ms = 50
crossfade_ms = 20
tail_cap_ms = 10000
warm = next

[midi]
in = M2            ; the FCB1010 on the M2's MIDI ports
profile = eurekaprom
channel = 1

[scene My rig]

; The IR loader and the delay are on a branch that only feeds FOH (out 1);
; out 2 (amp and cab) takes the signal straight after the amp.
[chain Nolly]
plugin = clap:~/.clap/TwoStorms Gain Stage.clap#com.twostorms.gainstage
name = Gain Stage
param = 54:1
plugin = clap:~/.clap/TwoStorms Compressor.clap
plugin = clap:~/.clap/TwoStorms Wah.clap
name = Wah
bypass = yes
plugin = vst3:~/.vst3/yabridge/Neural DSP/Archetype Nolly X.vst3
branch = FOH
tap = out2

[branch FOH]
plugin = clap:~/.clap/lsp-plugins.clap#in.lsp-plug.impulse_responses_mono
plugin = clap:~/.clap/TwoStorms Delay.clap
name = Delay
bypass = yes
tap = out1

[chain Ultra]
plugin = clap:~/.clap/TwoStorms Gain Stage.clap#com.twostorms.gainstage
name = Gain Stage
param = 54:1
plugin = vst3:~/.vst3/yabridge/Neural DSP/Darkglass Ultra.vst3
tap = out2
plugin = clap:~/.clap/lsp-plugins.clap#in.lsp-plug.impulse_responses_mono

[preset Nolly]
pedal = 6
display = NO

[preset Ultra]
pedal = 7
display = UL

[control Wah]
pedal = 4
enable = Wah

[control Delay]
pedal = 1
enable = Delay
