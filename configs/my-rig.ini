; Template for your own chains. Replace the paths with the real ones
; (stagehost scan <file> shows what is inside each plug-in file).
; Bridged Windows plug-ins usually live in ~/.vst3/yabridge after
; 'yabridgectl sync'. Plug-in settings: set them in REAPER for now and save
; their state, or use param lines; .rpp import comes next.

[audio]
device = hw:M2
rate = 48000
period = 64
periods = 2
input = 1
out1 = 1           ; FOH via the IMP 2
out2 = 2           ; power amp and cab
cpu = auto
priority = 80

[switching]
preroll_ms = 50
crossfade_ms = 20
tail_cap_ms = 10000
warm = next

[midi]
in = FCB
profile = eurekaprom
channel = 1

; Chain 1: Gain stage, Compressor, EQ, Wah, Archetype, Act, EQ, IR Loader,
; Multiband, Saturator, Tremolo. Out 2 before the IR loader.
[scene Chain 1]
pedal = 1
plugin = clap:~/.clap/TwoStorms Gain Stage.clap
plugin = clap:~/.clap/TwoStorms Compressor.clap
plugin = clap:~/.clap/TwoStorms EQ.clap
plugin = clap:~/.clap/TwoStorms Wah.clap
plugin = vst3:~/.vst3/yabridge/Archetype Nolly X.vst3
plugin = clap:~/.clap/TwoStorms Act.clap
plugin = clap:~/.clap/TwoStorms EQ.clap
tap = out2
plugin = vst3:~/.vst3/yabridge/IR Loader.vst3
plugin = vst3:~/.vst3/yabridge/FabFilter Pro-MB.vst3
plugin = vst3:~/.vst3/yabridge/FabFilter Saturn 2.vst3
plugin = vst3:~/.vst3/yabridge/Tremolo.vst3

; Chain 2: a second heavy amp.
[scene Chain 2]
pedal = 2
plugin = clap:~/.clap/TwoStorms Gain Stage.clap
plugin = vst3:~/.vst3/yabridge/Archetype Gojira X.vst3
tap = out2
plugin = vst3:~/.vst3/yabridge/IR Loader.vst3
plugin = clap:~/.clap/TwoStorms Delay.clap

; Chain 3: a third.
[scene Chain 3]
pedal = 3
plugin = clap:~/.clap/TwoStorms Gain Stage.clap
plugin = vst3:~/.vst3/yabridge/Darkglass Ultra X.vst3
tap = out2
plugin = vst3:~/.vst3/yabridge/IR Loader.vst3
