name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config libasound2-dev qt6-base-dev
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build
      - name: Unit tests
        run: ./build/cue_tests
      - name: App tests
        run: QT_QPA_PLATFORM=offscreen ./build/cue_app_tests
      - name: Bench the built-in demo
        run: ./build/cue bench configs/builtin-demo.ini --seconds 5
